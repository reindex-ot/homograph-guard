<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>⚠️ セキュリティ警告: 偽装URLがブロックされました</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #d9383a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: #ffffff;
      color: #24292f;
      max-width: 650px;
      width: 100%;
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .icon-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .icon {
      font-size: 38px;
    }
    h1 {
      font-size: 22px;
      color: #cf222e;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 18px;
    }
    .target-box {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .url-display {
      font-family: monospace;
      color: #cf222e;
      font-size: 15px;
      font-weight: bold;
      word-break: break-all;
      margin: 8px 0;
      background: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #eaeef2;
    }
    .reason-text {
      color: #57606a;
      font-size: 13px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-safe {
      background: #0969da;
      color: white;
    }
    .btn-safe:hover {
      background: #0856b5;
    }
    .btn-bypass {
      background: transparent;
      color: #656d76;
      text-decoration: underline;
      padding: 8px 12px;
      font-size: 13px;
    }
    .btn-bypass:hover {
      color: #cf222e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-title">
      <span class="icon">🛑</span>
      <h1>アクセスがブロックされました</h1>
    </div>
    <p>
      アクセスしようとしたWebサイトのドメイン名に、英数字に酷似した他言語文字（キリル文字等）やPunycodeが使われています。<strong>ホモグラフ攻撃（フィッシング詐欺）</strong>の危険性が極めて高いため、Homograph Guard により接続が遮断されました。
    </p>

    <div class="target-box">
      <div>ブロックされた接続先:</div>
      <div class="url-display" id="target-url">読み込み中...</div>
      <div class="reason-text" id="target-reason"></div>
      <div class="reason-text" id="target-details" style="margin-top:4px;"></div>
    </div>

    <div class="actions">
      <button class="btn btn-bypass" id="btn-bypass">危険を承知でアクセス（非推奨）</button>
      <button class="btn btn-safe" id="btn-back">安全なページに戻る</button>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
